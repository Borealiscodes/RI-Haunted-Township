<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RI-Haunted-Township — Q16.16 Open-World Horror Adventure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #040308; color: #dcd0eb; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 6px; }
    h1 { font-size: 0.94rem; letter-spacing: 0.08em; color: #c48cff; text-align: center; }
    #log-bar { width: 100%; max-width: 720px; background: #0c0712; border: 1px solid #3c1e4a; padding: 7px 10px; font-size: 0.76rem; color: #f0d9ff; line-height: 1.4; }
    #viewport-wrap { position: relative; width: 100%; max-width: 720px; aspect-ratio: 480 / 272; border: 2px solid #3c1e4a; overflow: hidden; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; }
    .controls { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 720px; }
    button, select { background: #140b1c; color: #eee2ff; border: 1px solid #4e2a63; padding: 6px 8px; font-family: monospace; font-size: 0.74rem; cursor: pointer; }
    button:active { background: #36184a; }
    button.accent { border-color: #9d4edd; color: #e0aaff; }
    button.danger { border-color: #ff4d6d; color: #ffb3c1; }
    #hud, details.chronicle-box { width: 100%; max-width: 720px; background: #09060e; border: 1px solid #261636; padding: 7px 10px; font-size: 0.75rem; line-height: 1.45; white-space: pre-line; }
    details.chronicle-box summary { cursor: pointer; color: #e0aaff; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🌊 RI-HAUNTED-TOWNSHIP (Q16.16 OPEN WORLD)</h1>
  <div id="log-bar">Loading Blackwater Cove Chronicle...</div>
  <div id="viewport-wrap">
    <canvas id="screen" width="480" height="272"></canvas>
  </div>

  <!-- Exploration Controls -->
  <div id="explore-controls" class="controls">
    <select id="mode-select">
      <option value="RECKONING">👁️ Mode: Reckoning (Hybrid)</option>
      <option value="PILGRIM">🕯️ Mode: Pilgrim (No Combat)</option>
      <option value="PURGER">⚔️ Mode: Purger (Combat Focus)</option>
    </select>
    <button id="left-btn">◀ West</button>
    <button id="right-btn">East ▶</button>
    <button id="gather-btn" class="accent">⛏️ Gather</button>
    <button id="trade-btn" class="accent">🤝 Guild Trade</button>
    <button id="chime-btn" class="accent">🔔 Ring Chime</button>
    <button id="gate-btn" class="accent">🚪 Manor Gate</button>
    <button id="narrate-btn">🎙️ Narrate</button>
    <button id="audio-btn">🎻 OST</button>
  </div>

  <!-- Bullet-Hell Danmaku Arena Controls (shown only during ambushes) -->
  <div id="arena-controls" class="controls" style="display:none;">
    <button id="a-left">◀</button>
    <button id="a-up">▲</button>
    <button id="a-down">▼</button>
    <button id="a-right">▶</button>
    <button id="parry-btn" class="danger">⚔️ Gladius Parry</button>
  </div>

  <div id="hud">Initializing Township...</div>
  <details class="chronicle-box" open>
    <summary>📜 BLACKWATER COVE CHRONICLE (STORY LOG)</summary>
    <div id="chronicle-list" style="margin-top:6px;white-space:normal;"></div>
  </details>
  <script type="module">
    import { Q16_ONE, q16Clamp } from './src/core/q16.js';
    import { TownshipSpatialSheaf, ALIGN } from './src/core/spatial_sheaf.js';
    import { CanopyChimePuzzle } from './src/physics/verlet_canopy.js';
    import { RadialFluidFog } from './src/physics/radial_fluid_fog.js';
    import { BulletHellArena } from './src/physics/bullet_hell_arena.js';
    import { FactionAttacheSystem } from './src/economy/faction_attache.js';
    import { TownshipFramebuffer, FB_WIDTH, FB_HEIGHT } from './src/render/township_renderer.js';
    import { TownshipSoundscape } from './src/audio/pentatonic_chime_synth.js';
    import { TownshipChronicle, OPENING_PROLOGUE } from './src/story/township_chronicle.js';

    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(FB_WIDTH, FB_HEIGHT);
    const imgU32 = new Uint32Array(imgData.data.buffer);
    const logBar = document.getElementById('log-bar');
    const hud = document.getElementById('hud');
    const chronicleList = document.getElementById('chronicle-list');
    const exploreBar = document.getElementById('explore-controls');
    const arenaBar = document.getElementById('arena-controls');

    const sheaf = new TownshipSpatialSheaf(1920, 120);
    const canopy = new CanopyChimePuzzle();
    const fluidFog = new RadialFluidFog();
    const arena = new BulletHellArena();
    const eco = new FactionAttacheSystem();
    const fb = new TownshipFramebuffer();
    const sound = new TownshipSoundscape();
    const chronicle = new TownshipChronicle();

    logBar.textContent = OPENING_PROLOGUE;

    const nodes = Array.of(
      { x: 180, collected: false },
      { x: 540, collected: false },
      { x: 920, collected: false },
      { x: 1340, collected: false },
      { x: 1680, collected: false }
    );

    const foes = Array.of(
      { x: 680, align: ALIGN.CHATTURGHA, name: 'Harbor Zealot', alive: true },
      { x: 1280, align: ALIGN.XELLOTATH, name: 'Canopy Stalker', alive: true },
      { x: 1740, align: ALIGN.MANTOROK, name: 'Manor Gatekeeper', alive: true }
    );

    const state = {
      playerX: 110,
      playerY: 186,
      cameraX: 0,
      facing: 1,
      moving: false,
      sanityQ16: Q16_ONE,
      activeAlign: ALIGN.ULYAOTH,
      hasTuningFork: false,
      canopy,
      fluidFog,
      arena,
      nodes,
      foes
    };

    let moveX = 0, moveY = 0, tick = 0;

    function unlockAudio() {
      sound.start();
      document.getElementById('audio-btn').textContent = '🎻 OST On';
    }
    document.getElementById('audio-btn').addEventListener('click', unlockAudio);

    function narrate(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      const gb = window.speechSynthesis.getVoices().find((v) => /en[-_]GB/i.test(v.lang));
      if (gb) u.voice = gb;
      u.lang = 'en-GB';
      u.pitch = 0.86;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }
    document.getElementById('narrate-btn').addEventListener('click', () => {
      unlockAudio();
      narrate(chronicle.entries.at(-1));
    });

    document.getElementById('mode-select').addEventListener('change', (e) => {
      eco.setMode(e.target.value);
      logBar.textContent = 'Playstyle mode set to ' + eco.mode + '.';
    });

    const bindHold = (id, dx, dy) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', () => { moveX = dx; moveY = dy; unlockAudio(); });
    };
    bindHold('left-btn', -1, 0);
    bindHold('right-btn', 1, 0);
    bindHold('a-left', -1, 0);
    bindHold('a-right', 1, 0);
    bindHold('a-up', 0, -1);
    bindHold('a-down', 0, 1);
    window.addEventListener('pointerup', () => { moveX = 0; moveY = 0; });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveX = -1;
      if (e.key === 'ArrowRight' || e.key === 'd') moveX = 1;
      if (e.key === 'ArrowUp' || e.key === 'w') moveY = -1;
      if (e.key === 'ArrowDown' || e.key === 's') moveY = 1;
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) moveX = 0;
      if (['ArrowUp','w','ArrowDown','s'].includes(e.key)) moveY = 0;
    });

    // Dedicated Exploration Action Buttons
    document.getElementById('gather-btn').addEventListener('click', () => {
      unlockAudio();
      for (const n of nodes) {
        if (!n.collected && Math.abs(state.playerX - n.x) < 34) {
          n.collected = true;
          eco.amberShards++;
          sound.playChime(466.16, true);
          logBar.textContent = 'Gathered Amber Resin Shard (+1 Shard).';
          return;
        }
      }
      logBar.textContent = 'No Amber Resin nodes within reach. Look for glowing shards along the road.';
    });

    document.getElementById('trade-btn').addEventListener('click', () => {
      unlockAudio();
      const trade = eco.tradeWithNearestFaction(state.playerX);
      if (trade) {
        state.hasTuningFork = eco.items.has('TUNING_FORK');
        if (eco.items.has('VITALITY_TINCTURE')) state.sanityQ16 = Q16_ONE;
        sound.playChime(392.0, true);
        logBar.textContent = trade.msg;
        chronicle.addEvent(trade.msg);
      } else {
        logBar.textContent = 'No faction guild outpost nearby. Visit Bell-Keepers (340m), Flesh-Harvesters (760m), or Archive Remnant (1460m).';
      }
    });

    document.getElementById('chime-btn').addEventListener('click', () => {
      unlockAudio();
      const hit = canopy.ringNearestChime(state.playerX);
      if (hit) {
        sound.playChime(hit.chime.hz, true);
        const msg = hit.solved
          ? 'CHIME LOCK UNSEALED! The Manor Gate at 1820m is now open!'
          : 'Struck Bell-Tower chime ' + hit.chime.note + ' (Wind sequence: Eb4 -> A4 -> D4).';
        logBar.textContent = msg;
        if (hit.solved) chronicle.addEvent(msg);
      } else {
        logBar.textContent = 'Walk beneath the Bell-Tower Canopy (1020m–1200m) to strike a suspended bronze chime.';
      }
    });

    document.getElementById('gate-btn').addEventListener('click', () => {
      unlockAudio();
      if (state.playerX >= 1775) {
        const msg = canopy.solved
          ? 'CHAPTER COMPLETE: With the Bell-Tower chimes harmonized, the wrought-iron gates of Roivas Manor swing open before midnight!'
          : 'The Manor Gate is sealed by a harmonic lock. Ring Eb4 -> A4 -> D4 in the Bell-Tower Canopy (1020m–1200m) first.';
        logBar.textContent = msg;
        if (canopy.solved) { chronicle.addEvent(msg); narrate(msg); }
      } else {
        logBar.textContent = 'The Manor Gates lie at the eastern end of the Old Mill road (1820m).';
      }
    });

    document.getElementById('parry-btn').addEventListener('click', () => {
      unlockAudio();
      const res = arena.parryBurst();
      if (res.event === 'BANISHED') {
        sound.playChime(587.33, true);
        eco.amberShards++;
        const msg = 'BANISHED ' + arena.bossName + '! Recovered +1 Amber Shard.';
        logBar.textContent = msg;
        chronicle.addEvent(msg);
      } else if (res.event === 'HIT') {
        sound.playChime(440.0, true);
        logBar.textContent = 'Parried bolt into ' + arena.bossName + '! (' + res.hp + ' HP left)';
      } else {
        logBar.textContent = 'Graze bullets (8+ Graze) or parry close to projectiles to strike!';
      }
    });

    function frame() {
      tick++;
      exploreBar.style.display = arena.active ? 'none' : 'flex';
      arenaBar.style.display = arena.active ? 'flex' : 'none';

      if (arena.active) {
        arena.moveSoul(moveX, moveY);
        const res = arena.step(tick);
        if (res.hit) state.sanityQ16 = q16Clamp(state.sanityQ16 - 4096, 0, Q16_ONE);
      } else {
        state.moving = moveX !== 0;
        if (moveX !== 0) {
          state.facing = moveX > 0 ? 1 : -1;
          state.playerX = q16Clamp(state.playerX + moveX * 3, 24, 1890);
        }
        state.cameraX = q16Clamp(state.playerX - 180, 0, 1920 - FB_WIDTH);

        if (eco.combatEnabled()) {
          for (const f of foes) {
            if (f.alive && Math.abs(state.playerX - f.x) < 28) {
              f.alive = false;
              state.activeAlign = f.align;
              arena.startEncounter(f.name, f.align, eco.items.has('BRONZE_GLADIUS') ? 2 : 3);
              logBar.textContent = 'AMBUSH! ' + f.name + ' traps you in a Danmaku ring! Dodge and tap [⚔️ Gladius Parry]!';
              break;
            }
          }
        }
      }

      const zoneKey = state.playerX < 480 ? 'HARBOR' : state.playerX < 960 ? 'SQUARE' : state.playerX < 1440 ? 'CANOPY' : 'MILL';
      const newLore = chronicle.recordDistrict(zoneKey);
      if (newLore) logBar.textContent = newLore;

      canopy.step(tick, state.playerX, state.playerY);
      fluidFog.step(state.playerX, state.playerY, state.cameraX, tick);
      sheaf.stepLocalNeighborhood(state.playerX);
      sound.updateTension(state.sanityQ16, arena.active);

      fb.renderWorld(state, tick);
      imgU32.set(fb.resolveRGBA32());
      ctx.putImageData(imgData, 0, 0);

      const zoneNames = { HARBOR: 'Foggy Harbor', SQUARE: 'Town Square', CANOPY: 'Bell-Tower Canopy', MILL: 'Old Mill & Manor Gate' };
      const relics = Array.from(eco.items).join(', ') || 'None';
      hud.textContent =
        'District: ' + zoneNames[zoneKey] + ' (' + state.playerX + 'm / 1920m) | Mode: ' + eco.mode + ' | Sanity: ' + ((state.sanityQ16 * 100) >> 16) + '%\n' +
        'Attaché Case: ' + eco.amberShards + ' Amber Shards | Relics: ' + relics + (arena.active ? ' | Graze: ' + arena.grazeCount : '');
      chronicleList.innerHTML = chronicle.entries.map((e) => '<p style="margin-bottom:4px;">• ' + e + '</p>').join('');
      requestAnimationFrame(frame);
    }

import { Q16_ONE, Q16_TAU, q16Clamp, q16Sin, q16Cos } from '../core/q16.js';
import { PENTATONIC_CHIMES } from '../physics/verlet_canopy.js';
import { FACTIONS } from '../economy/faction_attache.js';

export const FB_WIDTH = 480;
export const FB_HEIGHT = 272;

const BAYER_4X4 = Uint8Array.of(0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5);

export function buildTownshipCLUT8() {
  const lut = new Uint32Array(256);
  const ramps = Array.of(
    Array.of(235, 34, 54),   // 0: Chattur'gha (Crimson)
    Array.of(44, 154, 248),  // 1: Ulyaoth (Cobalt)
    Array.of(40, 226, 126),  // 2: Xel'lotath (Emerald)
    Array.of(184, 78, 244)   // 3: Mantorok (Amethyst)
  );
  for (let bank = 0; bank < 4; bank++) {
    const r0 = ramps.at(bank).at(0), g0 = ramps.at(bank).at(1), b0 = ramps.at(bank).at(2);
    for (let i = 0; i < 64; i++) {
      const c = i < 4 ? i : ((i * i) >> 6);
      const r = Math.min(255, ((r0 * c) >> 6) + (i > 52 ? (i - 52) * 16 : 0));
      const g = Math.min(255, ((g0 * c) >> 6) + (i > 52 ? (i - 52) * 16 : 0));
      const b = Math.min(255, ((b0 * c) >> 6) + (i > 52 ? (i - 52) * 16 : 0));
      lut[(bank << 6) + i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
  }
  return lut;
}

export class TownshipFramebuffer {
  constructor() {
    this.indices = new Uint8Array(FB_WIDTH * FB_HEIGHT);
    this.clut = buildTownshipCLUT8();
    this.rgba32 = new Uint32Array(FB_WIDTH * FB_HEIGHT);
  }

  /** Paint a thick 3px-wide directional impasto oil stroke with highlight edge */
  drawImpastoStroke(x0, y0, x1, y1, baseCol) {
    this.drawLine(x0, y0 - 1, x1, y1 - 1, Math.min(255, baseCol + 8));
    this.drawLine(x0, y0, x1, y1, baseCol);
    this.drawLine(x0, y0 + 1, x1, y1 + 1, Math.max(1, baseCol - 6));
  }

  renderWorld(state, tick) {
    const camX = state.cameraX | 0;
    const bank = (state.activeAlign & 3) << 6;
    const pxScreen = (state.playerX - camX) | 0;
    const pyScreen = state.playerY | 0;
    const lanternR = state.hasTuningFork ? 155 : 112;
    const lanternRSq = lanternR * lanternR;

    // 1. Base Sky + Radial Fluid Fog + Lantern Cone
    for (let y = 0; y < FB_HEIGHT; y++) {
      const row = y * FB_WIDTH;
      const bRow = (y & 3) << 2;
      const dy = y - (pyScreen + 12);
      const dy2 = dy * dy;
      const isGround = y >= 218;

      for (let x = 0; x < FB_WIDTH; x++) {
        const dx = x - pxScreen;
        const d2 = dx * dx + dy2;
        const fog = state.fluidFog.sampleFog(x, y);
        let light = isGround ? 9 : (4 + (fog >> 1));

        if (d2 < lanternRSq) {
          const beam = 26 - (((d2 * 21) / lanternRSq) | 0);
          light = q16Clamp(beam + (isGround ? 6 : 0), 4, 36);
        }
        const dither = BAYER_4X4[bRow + (x & 3)] >> 2;
        this.indices[row + x] = bank + q16Clamp(light + dither, 2, 40);
      }
    }

    // 2. Immersive Van Gogh Thick Impasto Sky Flow Field & Wind Eddies
    for (let sy = 14; sy < 132; sy += 14) {
      for (let sx = -16; sx < FB_WIDTH + 16; sx += 26) {
        const wx = sx + (camX >> 1);
        const angle = ((q16Sin(((wx * 700) + (sy * 1300) + (tick * 900)) % Q16_TAU) * 28000) >> 16);
        const dx = (11 * q16Cos(angle)) >> 16;
        const dy = (11 * q16Sin(angle)) >> 16;
        const tone = bank + 18 + (((wx >> 4) + (sy >> 3)) & 15);
        this.drawImpastoStroke(sx - dx, sy - dy, sx + dx, sy + dy, tone);
      }
    }

    // 3. Swirling Starry Vortex, Crescent Moon & Concentric Star Halos
    const moonX = 365 - ((camX >> 3) % 110);
    const moonY = 44;
    this.drawCircleOutline(moonX, moonY, 13, bank + 63, 18);
    this.drawCircleOutline(moonX + 4, moonY - 2, 11, bank + 10, 16);
    for (let ring = 1; ring <= 3; ring++) {
      const rad = 18 + ring * 11;
      for (let s = 0; s < 8; s++) {
        const a0 = (((tick * 1100) + s * 51472 + ring * 14000) % Q16_TAU);
        const a1 = (a0 + 25000) % Q16_TAU;
        this.drawImpastoStroke(
          moonX + ((rad * q16Cos(a0)) >> 16), moonY + (((rad >> 1) * q16Sin(a0)) >> 16),
          moonX + ((rad * q16Cos(a1)) >> 16), moonY + (((rad >> 1) * q16Sin(a1)) >> 16),
          bank + 34 + ring * 6
        );
      }
    }

    // Pulsing Van Gogh Star Halos across the sky
    for (const st of Array.of({ x: 75, y: 32 }, { x: 195, y: 58 }, { x: 280, y: 26 }, { x: 435, y: 68 })) {
      const sx = ((st.x - (camX >> 2)) + 480) % 480;
      const pulse = (tick >> 3) & 3;
      this.drawCircleOutline(sx, st.y, 3, bank + 63, 10);
      this.drawCircleOutline(sx, st.y, 7 + pulse, bank + 44, 14);
      this.drawCircleOutline(sx, st.y, 12 + pulse, bank + 28, 16);
    }
